name: Security and Build Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    name: Blinda Codice e Dipendenze
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Cambiala in '9.0.x' se dal .csproj hai visto che usi .NET 9

    - name: Ripristina pacchetti
      run: dotnet restore

    # Fa l'audit di sicurezza profondo su tutte le librerie NuGet usate dall'Akinator e dal CMS
    - name: Controllo vulnerabilità NuGet (Audit)
      run: dotnet list package --vulnerable --include-transitive

    - name: Build del progetto
      run: dotnet build --configuration Release --no-restore